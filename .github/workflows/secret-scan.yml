name: Secret & .env Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  scan:
    name: Scan for secrets and .env files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 1. Block any tracked .env file (current tree)
      #    Catches files committed in a previous run that are still present.
      #    Pattern: any path segment starting with ".env" except .env.example*
      # -----------------------------------------------------------------------
      - name: Check for committed .env files
        run: |
          FOUND=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example' || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: The following .env files are tracked by git:"
            echo "$FOUND"
            echo ""
            echo "Remove them with:  git rm --cached <file>"
            echo "Then ensure they are listed in .gitignore."
            exit 1
          fi
          echo "OK: No committed .env files found in tree."

      # -----------------------------------------------------------------------
      # 2. Determine the commit range to diff so we scan *introduced* content,
      #    not just the tip of the branch.
      # -----------------------------------------------------------------------
      - name: Determine diff range
        id: diff-range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Triple-dot: diff from merge-base to HEAD covers all PR commits
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch — no before SHA; diff every commit not yet on the remote
            RANGE="origin/HEAD...HEAD"
            # If origin/HEAD doesn't exist (empty repo), fall back to scanning HEAD alone
            git rev-parse origin/HEAD >/dev/null 2>&1 || RANGE=""
          else
            RANGE="${{ github.event.before }}...${{ github.sha }}"
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Diff range: ${RANGE:-<full tree scan>}"

      # -----------------------------------------------------------------------
      # 3. Scan introduced diff (added lines only) for bare secret patterns.
      #    Falls back to a full tree scan when no range is available.
      # -----------------------------------------------------------------------
      - name: Scan introduced diff for secret patterns
        run: |
          RANGE="${{ steps.diff-range.outputs.range }}"

          PATTERN='(SECRET|PASSWORD|API_KEY|PRIVATE_KEY|ACCESS_TOKEN|AUTH_TOKEN|CLIENT_SECRET)\s*=\s*['"'"'"]?[A-Za-z0-9+/\-_]{16,}'
          TOKEN_PATTERN='(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_\-]{35,}|ghp_[A-Za-z0-9]{36,}|ghs_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9\-]+)'

          if [ -n "$RANGE" ]; then
            # Scan only lines *added* in the diff range
            DIFF=$(git diff "$RANGE" -- \
              ':!*.example' ':!*.md' ':!*.txt' ':!*lock*' 2>/dev/null || true)
            ADDED=$(printf '%s' "$DIFF" | grep -E "^\+" | grep -Ev "^\+\+\+" || true)
            SECRET_HITS=$(printf '%s' "$ADDED" | grep -E "$PATTERN" || true)
            TOKEN_HITS=$(printf '%s' "$ADDED" | grep -E "$TOKEN_PATTERN" || true)
          else
            # Fallback: scan full tree (new repo with no remote history)
            SECRET_HITS=$(git grep -Ern "$PATTERN" -- \
              ':!*.example' ':!*.md' ':!*.txt' ':!*lock*' ':!*.yml' ':!*.yaml' \
              || true)
            TOKEN_HITS=$(git grep -Ern "$TOKEN_PATTERN" -- \
              ':!*.example' ':!*.md' ':!*.txt' ':!*lock*' \
              || true)
          fi

          COMBINED=$(printf '%s\n%s' "$SECRET_HITS" "$TOKEN_HITS" | sed '/^$/d')

          if [ -n "$COMBINED" ]; then
            echo "ERROR: Possible secrets detected in introduced changes:"
            echo "$COMBINED"
            echo ""
            echo "Move secrets to environment variables / Replit Secrets."
            echo "Reference them by name (e.g. process.env.MY_KEY) only."
            exit 1
          fi
          echo "OK: No bare secret patterns found in introduced changes."
